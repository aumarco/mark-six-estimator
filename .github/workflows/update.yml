name: build-and-update
on:
  push:
    branches: [main]
    paths-ignore: ['index.html']
  schedule:
    - cron: '0 15 * * 0,2,3,4,6'
    - cron: '0 1 * * 0,1,3,4,5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh draw data
        run: python3 scripts/update.py
      - run: mkdir -p _site && cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit refreshed data
        run: |
          git config user.name mark-six-bot
          git config user.email bot@users.noreply.github.com
          git add index.html
          git diff --staged --quiet || git commit -m "auto: refresh Mark Six results"
          git push
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
