name: update-results
on:
  schedule:
    - cron: '0 15 * * 0,2,3,4,6'
    - cron: '0 1 * * 0,1,3,4,5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Refresh draw data
        run: python3 scripts/update.py
      - name: Commit and push
        run: |
          git config user.name "mark-six-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: refresh Mark Six results"
          git push origin gh-pages
